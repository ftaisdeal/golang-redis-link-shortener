services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - redis
    environment:
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - CODE_LENGTH=7
      - RATE_LIMIT_PER_MINUTE=60
    ports:
      - "8080:8080"
